<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ダンジョンレガシーのアプリアイコン（ホーム画面用）。PNGはこのSVGから書き出す（README「アイコン」参照） -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3a2b5c"/>
      <stop offset="0.55" stop-color="#1c1630"/>
      <stop offset="1" stop-color="#0e0c16"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd8ea"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9aa6bf"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#c8891e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <!-- 剣1本（中心を原点に、刃を上向き） -->
    <g id="sword">
      <path d="M0,-190 L16,-160 L16,40 L-16,40 L-16,-160 Z" fill="url(#blade)" stroke="#5b6680" stroke-width="3"/>
      <path d="M0,-176 L0,32" stroke="#8d98b2" stroke-width="3"/>
      <rect x="-62" y="40" width="124" height="20" rx="10" fill="url(#gold)" stroke="#7a4f10" stroke-width="3"/>
      <rect x="-11" y="60" width="22" height="72" rx="6" fill="#6b3f1f" stroke="#3d220f" stroke-width="3"/>
      <circle cx="0" cy="146" r="17" fill="url(#gold)" stroke="#7a4f10" stroke-width="3"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="246" r="200" fill="url(#glow)"/>
  <circle cx="256" cy="246" r="178" fill="none" stroke="#ffd76a" stroke-opacity="0.35" stroke-width="6"/>
  <use href="#sword" transform="translate(256 236) rotate(-40) translate(0 70)"/>
  <use href="#sword" transform="translate(256 236) rotate(40) translate(0 70)"/>
</svg>
