name: Cave floor diagnostics
on:
  push:
    branches:
      - 'feature/cave-floor-diagnostics-*'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Measure 5F floor failures and boss survival
        run: node tools/cave-diagnostics.js --trials=240
      - name: Compare late-floor normal enemies without changing boss
        run: node tools/cave-diagnostics.js --late --trials=240
