name: Game quality gate

on:
  push:
    branches:
      - main
      - architecture/web-first-foundation
  pull_request:

permissions:
  contents: read

jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run game tests
        run: npm test
      - name: Verify Web production candidate build
        run: npm run build:release:web
