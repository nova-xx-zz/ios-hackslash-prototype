<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0c16">
<title>クエストパーティ</title>
<!-- css/js を更新したら ?v= の数字を必ず上げること（GitHub Pages/Safariのキャッシュで更新が反映されない対策） -->
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<div id="app">

  <!-- タイトル画面 -->
  <section id="screen-title" class="screen title-screen">
    <div class="title-glow"></div>
    <div class="panel narrow title-panel">
      <button class="announce-icon-btn hidden" id="btnTitleAnnounce" aria-label="お知らせ">
        📢<span class="announce-badge hidden" id="titleAnnounceBadge"></span>
      </button>
      <div class="title-emblem">⚔</div>
      <h1 class="title-logo">クエストパーティ</h1>
      <p class="title-logo-en">Quest Party</p>
      <p class="sub">5人パーティ・オート戦闘のハクスラダンジョン<br>プロトタイプ</p>
      <button class="btn primary title-cta" id="btnGoBattle">⚔ はじめる</button>
      <p class="best" id="bestClearText"></p>
    </div>
  </section>

  <!-- 設定画面 -->
  <section id="screen-settings" class="screen hidden">
    <div class="roster-wrap">
      <div class="roster-header">
        <div class="map-title">設定</div>
        <button class="btn small ghost" id="btnSettingsBack">もどる</button>
      </div>
      <div class="roster-body">
        <div class="settings-row">
          <span class="settings-label">バージョン</span>
          <span class="settings-value">プロトタイプ版</span>
        </div>
        <button class="btn small ghost" id="btnSettingsAnnounce" style="margin-top:12px;">冒険者ギルドからのお知らせ</button>
        <p class="sub" style="margin-top:16px;">設定項目は今後ここに追加していく予定です。</p>
      </div>
    </div>
  </section>

  <!-- 冒険者ギルドからのお知らせ -->
  <section id="screen-announcements" class="screen hidden">
    <div class="roster-wrap">
      <div class="roster-header">
        <div class="map-title">冒険者ギルドからのお知らせ</div>
        <button class="btn small ghost" id="btnAnnounceBack">もどる</button>
      </div>
      <div class="detail-tabs" id="announceTabs"></div>
      <div id="announceBody" class="roster-body"></div>
    </div>
  </section>

  <!-- モンスター図鑑 -->
  <section id="screen-dex" class="screen hidden">
    <div class="roster-wrap">
      <div class="roster-header">
        <div class="map-title">モンスター図鑑</div>
        <button class="btn small ghost" id="btnDexBack">もどる</button>
      </div>
      <div class="dex-count" id="dexCount"></div>
      <div id="dexBody" class="roster-body"></div>
    </div>
  </section>

  <!-- パーティ編成画面 -->
  <section id="screen-jobs" class="screen hidden">
    <div class="roster-wrap">
      <div class="roster-header">
        <div class="map-title">パーティを編成する</div>
        <button class="btn small ghost" id="btnJobsDone">もどる</button>
      </div>
      <div id="rosterBody" class="roster-body"></div>
      <div class="roster-footer">
        <span id="rosterCount" class="roster-count"></span>
        <button class="btn small ghost" id="btnRecruit">仲間を探す</button>
      </div>
    </div>
  </section>

  <!-- キャラ作成画面 -->
  <section id="screen-create" class="screen hidden">
    <div class="roster-wrap">
      <div class="roster-header">
        <div class="map-title">仲間を作る</div>
        <button class="btn small ghost" id="btnCreateBack">もどる</button>
      </div>
      <div id="createBody" class="roster-body"></div>
      <div class="roster-footer">
        <button class="btn small ghost" id="btnCreateRandom">ランダム</button>
        <button class="btn small primary" id="btnCreateConfirm">なかまにする</button>
      </div>
    </div>
  </section>

  <!-- キャラ詳細画面 -->
  <section id="screen-chardetail" class="screen hidden">
    <div class="roster-wrap">
      <div class="roster-header">
        <div class="map-title" id="detailName">—</div>
        <button class="btn small ghost" id="btnDetailBack">もどる</button>
      </div>
      <div id="detailBody" class="roster-body"></div>
      <div class="detail-tabs" id="detailTabs"></div>
    </div>
  </section>

  <!-- マップ画面 -->
  <section id="screen-map" class="screen hidden">
    <div class="map-wrap">
      <div class="map-header">
        <div class="map-title">ダンジョンをえらぶ</div>
        <div>
          <button class="btn small ghost" id="btnMapJobs">パーティ編成</button>
          <button class="btn small ghost" id="btnMapBack">もどる</button>
        </div>
      </div>
      <div id="mapBoard" class="map-board">
        <svg id="mapLines" class="map-lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div id="mapNodes"></div>
      </div>
      <div id="dungeonInfo" class="dungeon-info">
        <p class="sub" style="margin:0">ダンジョンをタップすると詳細が表示されます。</p>
      </div>
    </div>
  </section>

  <!-- 探索画面（ログ + ドック） -->
  <section id="screen-battle" class="screen hidden">
    <div class="explore-wrap">
      <div class="explore-header">
        <div>
          <div class="team-name" id="teamName">第一のパーティ</div>
          <div class="explore-sub" id="exploreSub"></div>
          <div class="material-line" id="materialLine">強化石 0</div>
        </div>
        <div class="explore-header-actions">
          <button class="btn small ghost" id="btnAutoDisassembleToggle">自動分解 OFF</button>
          <button class="btn small ghost" id="btnSpeedToggle">x1</button>
        </div>
      </div>
      <div id="disassembleFilterRow" class="disassemble-filter-row hidden"></div>
      <div id="logFeed" class="log-feed"></div>
    </div>

    <div id="bottomDock" class="bottom-dock">
      <div class="dock-progress">
        <div class="dock-progress-row">
          <span id="dockDungeon">—</span>
          <span id="dockStatus"></span>
        </div>
        <div class="stat-bar dungeon"><div class="fill" id="dockProgressFill" style="width:0%"></div></div>
      </div>
      <div id="partyRow" class="party-row"></div>
      <div id="autoRepeatRow" class="auto-repeat-row"></div>
      <div class="dock-actions">
        <button class="btn small ghost" id="btnRedeploy">再出撃</button>
        <button class="btn small ghost" id="btnDockMap">マップ</button>
      </div>
      <div class="team-tabs" id="teamTabs"></div>
      <div class="hub-nav-row">
        <button class="hub-nav-btn" id="btnHubJobs">
          <span class="hub-nav-icon">👥</span><span class="hub-nav-label">編成</span>
        </button>
        <button class="hub-nav-btn active" id="btnHubExplore">
          <span class="hub-nav-icon">⚔️</span><span class="hub-nav-label">探索</span>
        </button>
        <button class="hub-nav-btn" id="btnHubDex">
          <span class="hub-nav-icon">📖</span><span class="hub-nav-label">図鑑</span>
        </button>
        <button class="hub-nav-btn" id="btnHubSettings">
          <span class="hub-nav-icon">⚙️</span><span class="hub-nav-label">設定</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ジョブ/しゅぞく 詳細モーダル -->
  <div id="pickModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon" id="pmIcon">—</div>
      <div class="modal-name" id="pmName">—</div>
      <div class="modal-desc" id="pmDesc"></div>
      <div class="modal-stats" id="pmStats"></div>
      <div class="modal-list" id="pmList"></div>
      <div class="modal-strip" id="pmStrip"></div>
      <button class="btn primary modal-ok" id="btnPickModalOk">OK</button>
    </div>
  </div>

  <!-- モンスター図鑑 詳細モーダル -->
  <div id="dexModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon" id="dexIcon">—</div>
      <div class="modal-name" id="dexName">—</div>
      <div class="dex-element" id="dexElement"></div>
      <div class="modal-desc" id="dexDesc"></div>
      <div class="modal-stats" id="dexStats"></div>
      <button class="btn ghost modal-ok" id="btnDexModalClose">とじる</button>
    </div>
  </div>

  <!-- 自動周回オフライン進行の結果モーダル -->
  <div id="offlineModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">⏱</div>
      <div class="modal-name">おかえりなさい</div>
      <div class="modal-desc" id="offlineDesc"></div>
      <button class="btn primary modal-ok" id="btnOfflineClose">とじる</button>
    </div>
  </div>

  <!-- お知らせ詳細モーダル -->
  <div id="announcementModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">📢</div>
      <div class="modal-name" id="announceModalTitle">—</div>
      <div class="sub" id="announceModalMeta" style="margin-bottom:4px;"></div>
      <div class="modal-desc" id="announceModalBody"></div>
      <button class="btn primary modal-ok" id="btnAnnounceModalClose">とじる</button>
    </div>
  </div>

  <!-- 装備強化モーダル -->
  <div id="enhanceModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon" id="enIcon">—</div>
      <div class="modal-name" id="enName">—</div>
      <div class="modal-desc" id="enDesc"></div>
      <div class="modal-stats" id="enStats"></div>
      <div class="enhance-result" id="enResult"></div>
      <button class="btn primary modal-ok" id="btnEnhanceGo">強化する</button>
      <button class="btn ghost modal-ok" id="btnEnhanceClose">とじる</button>
    </div>
  </div>

</div>
<script src="data/announcements.js?v=2"></script>
<script src="data/roadmap.js?v=2"></script>
<script src="js/data.js?v=3"></script>
<script src="js/game.js?v=10"></script>
</body>
</html>
